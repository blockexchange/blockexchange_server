<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Online</title>
    <link rel="icon" href="/pics/bx_big.png" type="image/png">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111;
            color: #ddd;
            font-family: system-ui, sans-serif;
        }
        /* the canvas must not have a border or padding, or mouse coords will be wrong */
        #canvas {
            display: none;
            width: 100%;
            height: 100%;
            border: 0;
            padding: 0;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            text-align: center;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #555;
            border-top-color: #ddd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        button {
            font-size: 1.2rem;
            padding: 12px 32px;
            border: 0;
            border-radius: 6px;
            background: #198754;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #157347; }
        a { color: #8ab4f8; }
        .error { color: #f5c26b; max-width: 600px; }
        .muted { color: #999; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="loading" class="overlay">
        <div class="spinner"></div>
        <div>Loading <b id="schema-name">schematic</b>: <span id="loading-msg">initializing…</span></div>
        <div class="muted">The game and mods are prepared on the server, the first start can take a minute.</div>
    </div>

    <div id="start" class="overlay" style="display: none;">
        <button type="button" id="start-btn">Start (fullscreen)</button>
        <div class="muted">Press Esc to leave fullscreen.</div>
    </div>

    <div id="error" class="overlay" style="display: none;">
        <div class="error">&#9888; <span id="error-msg"></span></div>
        <div>
            <a href="" onclick="location.reload(); return false;">Restart</a>
            &middot;
            <a id="back-link" href="/">Back to the schematic</a>
        </div>
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type="module" src="main.js"></script>
</body>
</html>
